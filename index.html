<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 28px; }
    output { display: block; font-size: 64px; margin: 24px 0; }
    button {
      padding: 12px 18px;
      margin: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      color: #222;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #eaeaea; }
    button:focus-visible { outline: 3px solid #238f98; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Counter App</h1>
    <output id="count" aria-live="polite" aria-label="Current count">0</output>
    <button id="decrease" type="button" aria-label="Decrease count">−</button>
    <button id="reset" type="button">Reset</button>
    <button id="increase" type="button" aria-label="Increase count">+</button>
  </main>
  <script>
    let count = 0;
    const display = document.getElementById('count');
    function update(value) {
      count = value;
      display.textContent = count;
    }
    document.getElementById('decrease').addEventListener('click', () => update(count - 1));
    document.getElementById('reset').addEventListener('click', () => update(0));
    document.getElementById('increase').addEventListener('click', () => update(count + 1));
  </script>
</body>
</html>
